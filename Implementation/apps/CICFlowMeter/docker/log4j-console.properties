# log4j 1.x config used by the cicflowmeter-worker image.
# Console only: the worker runs with a read-only root filesystem and its stdout/stderr
# is captured by pcap-watcher (and saved next to quarantined pcaps).
log4j.rootLogger=INFO,CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p %c - %m%n
